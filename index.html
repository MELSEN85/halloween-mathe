<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Die fünf Türen der Spukvilla</title><style>
:root{--bg:#140d2c;--panel:#271a48;--panel2:#352458;--gold:#ffca69;--text:#fff7e8;--mint:#91f2c2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#4a296a,#140d2c 65%);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}main{max-width:900px;margin:auto;padding:20px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:800;color:var(--gold)}button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:13px 17px;font-weight:750;touch-action:manipulation}button:focus-visible{outline:3px solid white;outline-offset:3px}.tiny{font-size:14px;padding:9px 12px;background:#594176;color:white}.hero{text-align:center;padding:24px 8px 10px}.hero .art{font-size:clamp(60px,14vw,100px)}h1{font-size:clamp(27px,6vw,43px);margin:6px 0;color:var(--gold)}h2{font-size:clamp(23px,4vw,32px);margin:5px 0 12px}.lead{line-height:1.55;font-size:18px;max-width:650px;margin:12px auto}.panel{background:rgba(39,26,72,.94);border:2px solid #7255a1;border-radius:24px;padding:22px;margin:20px 0;box-shadow:0 10px 30px #08041155}.center{text-align:center}.gold{color:var(--gold)}.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:24px 0}.door{min-height:170px;background:linear-gradient(145deg,#49306b,#27173d);border:3px solid #a07dc2;color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;transition:transform .12s}.door:active{transform:scale(.97)}.door .emoji{font-size:50px}.door .name{font-size:16px}.door .state{font-size:13px;color:#f8d98b}.door.done{border-color:var(--mint)}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.level{background:#463064;color:white;border:2px solid transparent;padding:16px 8px}.level.selected{border-color:var(--gold);background:#684283}.level small{display:block;font-size:12px;font-weight:500;margin-top:5px}.question{background:#1d1237;border-radius:20px;padding:22px 12px;margin:18px 0;text-align:center}.prompt{font-size:20px;line-height:1.5}.visual{font-size:clamp(27px,6vw,43px);line-height:1.6;letter-spacing:3px;white-space:pre-wrap;overflow-wrap:anywhere;margin:18px auto}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:15px 0}.choice{background:#f7e7ca;color:#241339;min-height:64px;font-size:clamp(20px,4vw,27px);border:3px solid transparent}.choice.selected{border-color:#ffb534}.choice.correct{background:#9bf1c2}.choice.wrong{background:#ffc0c0}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:15px}.primary{background:var(--gold);color:#241339}.secondary{background:#634881;color:white}.hint{background:#3b2a57;border-left:4px solid var(--gold);border-radius:10px;padding:13px;margin-top:14px}.feedback{padding:16px;border-radius:15px;background:#3e3356;margin-top:14px;font-size:18px}.progress{height:15px;background:#4d3966;border-radius:50px;overflow:hidden;margin:10px 0}.bar{height:100%;background:linear-gradient(90deg,#ffb85b,#8fe7ba);transition:width .3s}.footer{text-align:center;opacity:.8;font-size:13px;margin-top:30px}.hidden{display:none!important}.stars{font-size:32px;letter-spacing:8px}.rule{font-size:16px;color:#d7c9e8}.introcard{font-size:18px}.pill{display:inline-block;padding:6px 12px;background:#51386f;border-radius:40px;font-size:14px}.path{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.path span{background:#493261;border-radius:10px;padding:9px}.success{color:#a8ffcf}.warn{color:#ffe39d}@media(max-width:520px){.panel{padding:15px}.levels{gap:5px}.level{font-size:14px}.doors{grid-template-columns:repeat(2,1fr)}.choices{gap:9px}}
</style></head><body><main><header class="top"><div class="brand">🎃 MATHE FÜR KLEINE ASSE</div><button class="tiny" id="reset">↺ Neustart</button></header><div id="app" aria-live="polite"></div><footer class="footer">Gemeinsam knobeln • Ohne Anmeldung • Keine Datenübertragung</footer></main><script>
const rooms=[
 {name:'Kürbis-Code',icon:'🎃',story:'Die Kürbisse bewachen die erste Tür. Findet die fehlende Zahl!',q:[
 {prompt:'Welche Zahl fehlt?',visual:'2   4   6   ❓',opts:['7','8','9','10'],a:1,hint:'Zähle immer zwei weiter.',why:'2, 4, 6, 8: immer +2.'},
 {prompt:'Welche Zahl folgt?',visual:'3   6   10   15   ❓',opts:['18','19','20','21'],a:3,hint:'Die Sprünge sind +3, +4, +5. Wie geht es weiter?',why:'Die Abstände wachsen: +3, +4, +5, +6. Also 21.'},
 {prompt:'Entdeckt die geheime Doppelregel!',visual:'2   5   4   7   6   9   ❓',opts:['8','10','11','12'],a:0,hint:'Schau nur auf jede zweite Zahl: 2, 4, 6, ...',why:'Zwei Zahlenreihen wechseln sich ab: 2, 4, 6, 8 und 5, 7, 9.'}]},
 {name:'Geisterfamilie',icon:'👻',story:'Die Geister wollen in der richtigen Reihenfolge schweben.',q:[
 {prompt:'Wer steht in der Mitte? Von klein nach groß!',visual:'👻  klein     👻  mittel     👻  groß',opts:['klein','mittel','groß'],a:1,hint:'Die Mitte ist zwischen klein und groß.',why:'Der mittelgroße Geist steht in der Mitte.'},
 {prompt:'Drei Geister stehen nebeneinander. Blau ist links von Rot. Gelb ist rechts von Rot. Wer steht in der Mitte?',visual:'🔵     🔴     🟡',opts:['🔵','🔴','🟡'],a:1,hint:'Stellt euch zuerst Rot vor. Blau muss links, Gelb rechts stehen.',why:'Die Reihenfolge ist Blau – Rot – Gelb.'},
 {prompt:'Drei Geister tauschen Plätze. Wie viele verschiedene Reihenfolgen sind möglich?',visual:'👻🔴   👻🔵   👻🟡',opts:['3','4','6','9'],a:2,hint:'Wer kann vorne stehen? Für jeden gibt es zwei Möglichkeiten für die anderen.',why:'3 Möglichkeiten für den ersten Platz, 2 für den zweiten, 1 für den dritten: 6.'}]},
 {name:'Hexenkessel',icon:'🧙',story:'Die Hexe braucht die richtige Menge Zauberzutaten.',q:[
 {prompt:'Zusammen sollen es 10 Sterne sein. Wie viele fehlen?',visual:'⭐ ⭐ ⭐ ⭐  +  ❓  =  10',opts:['4','5','6','7'],a:2,hint:'Zähle von 4 bis 10 weiter.',why:'4 + 6 = 10.'},
 {prompt:'Im Kessel sind 20 Sterne. 8 sind rot und 5 blau. Wie viele sind grün?',visual:'🔴 8   🔵 5   🟢 ❓',opts:['6','7','8','9'],a:1,hint:'8 und 5 sind zusammen 13. Wie viel fehlt bis 20?',why:'20 − 8 − 5 = 7.'},
 {prompt:'Drei Zutaten ergeben 20. Alle Mengen sind verschieden. Rot hat 2 mehr als Blau. Grün hat doppelt so viele wie Blau. Wie viel hat Blau?',visual:'🔴 = 🔵 + 2\n🟢 = 2 × 🔵\n🔴 + 🔵 + 🟢 = 20',opts:['3','4','5','6'],a:1,hint:'Probiere Blau = 4. Dann Rot = 6 und Grün = 8. Passt die Summe?',why:'Blau = 4, Rot = 6, Grün = 8: zusammen 18. Moment! Für 20 muss Blau = 4,5 sein. Das Rätsel braucht eine Anpassung.'}]},
 {name:'Fledermaus-Muster',icon:'🦇',story:'Die Fledermäuse zeigen geheime Muster.',q:[
 {prompt:'Was kommt als Nächstes?',visual:'🦇  🌙  🦇  🌙  ❓',opts:['🌙','🦇','⭐','🎃'],a:1,hint:'Zwei Zeichen wechseln sich ab.',why:'Auf den Mond folgt immer eine Fledermaus.'},
 {prompt:'Welches Zeichen fehlt?',visual:'🦇 🌙 ⭐\n🌙 ⭐ 🦇\n⭐ 🦇 ❓',opts:['⭐','🎃','🌙','🦇'],a:2,hint:'In jeder Reihe kommt jedes Zeichen genau einmal vor.',why:'In der letzten Reihe fehlt der Mond.'},
 {prompt:'Welches Feld muss unten rechts stehen? Jede Reihe und jede Spalte enthält jedes Zeichen genau einmal.',visual:'🎃 🦇 🌙\n🌙 🎃 🦇\n🦇 🌙 ❓',opts:['🦇','🌙','🎃','⭐'],a:2,hint:'Schau in die letzte Reihe und die letzte Spalte.',why:'In der letzten Reihe und Spalte fehlt der Kürbis.'}]},
 {name:'Spuk-Labyrinth',icon:'🏰',story:'Findet den sicheren Weg zur Schatzkammer!',q:[
 {prompt:'Welcher Weg führt zum Schatz? Folge den Pfeilen.',visual:'🚪 → → ↓\n        ↓\n        💎',opts:['rechts, rechts, runter','links, hoch','runter, links'],a:0,hint:'Starte bei der Tür und folge den Pfeilen.',why:'Zweimal rechts und dann nach unten.'},
 {prompt:'Welche Strecke ist am kürzesten?',visual:'🚪 → 💎\nWeg A: 3 + 4 Schritte\nWeg B: 2 + 3 Schritte\nWeg C: 4 + 2 Schritte',opts:['Weg A','Weg B','Weg C'],a:1,hint:'Rechne die Schritte jedes Weges zusammen.',why:'Weg B braucht 5 Schritte, Weg C 6 und Weg A 7.'},
 {prompt:'Ihr geht genau 4 Schritte: nur nach rechts ➡️ oder nach oben ⬆️. Genau 2 Schritte müssen nach rechts gehen. Wie viele verschiedene Wege gibt es?',visual:'➡️ ➡️ ⬆️ ⬆️\nWie viele Reihenfolgen?',opts:['4','5','6','8'],a:2,hint:'Schreibe die möglichen Positionen der zwei Rechts-Schritte auf.',why:'Es gibt 6 Anordnungen: RRHH, RHRH, RHHR, HRRH, HRHR, HHRR.'}]}
];
// Correct the advanced cauldron puzzle to an integer-valued, unique solution.
rooms[2].q[2]={prompt:'Drei Zutaten ergeben 22. Alle Mengen sind verschieden. Rot hat 2 mehr als Blau. Grün hat doppelt so viele wie Blau. Wie viel hat Blau?',visual:'🔴 = 🔵 + 2\n🟢 = 2 × 🔵\n🔴 + 🔵 + 🟢 = 22',opts:['3','4','5','6'],a:2,hint:'Probiere Blau = 5. Dann Rot = 7 und Grün = 10.',why:'Blau = 5, Rot = 7, Grün = 10. Zusammen 22.'};
let state={screen:'home',room:0,level:0,done:{},attempt:null,hint:false,names:['','']};
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(t){if(!('speechSynthesis'in window)){alert('Vorlesen wird auf diesem Gerät nicht unterstützt.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[🎃👻🧙🦇🏰🔴🔵🟢⭐🌙💎➡️⬆️❓]/gu,' '));u.lang='de-DE';u.rate=.82;speechSynthesis.speak(u)}
function render(){const count=Object.keys(state.done).length;let html='';if(state.screen==='home')html=`<section class="hero"><div class="art">🌕 🏚️ 🦇</div><h1>Die fünf Türen der Spukvilla</h1><p class="lead">Oh nein! Die Schatzkammer ist verschlossen. Öffnet gemeinsam fünf magische Türen. Hinter jeder Tür wartet ein Knobelrätsel!</p></section><section class="panel center"><div class="stars">🎃 👻 ⭐</div><h2>Seid ihr bereit?</h2><p class="introcard">👫 Zwei Kinder · 📱 Ein iPad · 🧠 Gemeinsam denken</p><p>Wählt an jeder Tür eine Stufe. Ihr könnt jederzeit eine andere Stufe probieren.</p><p class="rule">🎃 leicht &nbsp; 🎃🎃 knifflig &nbsp; 🎃🎃🎃 Profi</p><button class="primary" data-action="start">🔑 Abenteuer starten</button></section>`;
else if(state.screen==='map')html=`<section class="hero"><div class="art">🏚️ 🌙</div><h1>Die Spukvilla</h1><p class="lead">Tippt auf eine Tür. Knobelt zusammen und sammelt fünf magische Schlüssel!</p><div class="pill">🔑 ${count} von 5 Schlüsseln</div><div class="progress"><div class="bar" style="width:${count*20}%"></div></div></section><section class="doors">${rooms.map((r,i)=>`<button class="door ${state.done[i]!==undefined?'done':''}" data-room="${i}"><span class="emoji">${r.icon}</span><span class="name">Tür ${i+1}<br>${r.name}</span><span class="state">${state.done[i]!==undefined?'🔑 Geschafft!':'🔒 Öffnen'}</span></button>`).join('')}</section><div class="center">${count===5?'<button class="primary" data-action="finish">✨ Zur Schatzkammer!</button>':'<p class="rule">Ihr braucht fünf Schlüssel für die Schatzkammer.</p>'}</div>`;
else if(state.screen==='room'){const r=rooms[state.room],q=r.q[state.level];html=`<div class="actions" style="justify-content:space-between"><button class="tiny" data-action="map">← Zur Villa</button><span class="pill">Tür ${state.room+1} von 5</span></div><section class="panel center"><div style="font-size:60px">${r.icon}</div><h2>${r.name}</h2><p class="lead">${r.story}</p><button class="tiny" data-action="speak">🔊 Vorlesen</button></section><section class="panel"><h2 class="center">Wählt eure Knobelstufe</h2><div class="levels">${[0,1,2].map(i=>`<button class="level ${i===state.level?'selected':''}" data-level="${i}">${'🎃'.repeat(i+1)}<small>${['Gut lösbar','Knifflig','Profi'][i]}</small></button>`).join('')}</div><div class="question"><div class="prompt">${esc(q.prompt)}</div><div class="visual">${esc(q.visual)}</div><button class="tiny" data-action="speakq">🔊 Aufgabe hören</button></div><div class="choices">${q.opts.map((o,i)=>`<button class="choice ${state.attempt===i?(i===q.a?'correct':'wrong'):''}" data-choice="${i}">${esc(o)}</button>`).join('')}</div>${state.attempt!==null?`<div class="feedback ${state.attempt===q.a?'success':'warn'}">${state.attempt===q.a?'🌟 Richtig! '+esc(q.why):'🧠 Noch nicht. Überlegt gemeinsam und versucht es erneut!'}</div>`:''}${state.hint?`<div class="hint">💡 ${esc(q.hint)}</div>`:''}<div class="actions"><button class="secondary" data-action="hint">💡 Tipp</button>${state.attempt===q.a?`<button class="primary" data-action="complete">🔑 Schlüssel einsammeln</button>`:''}</div></section>`}
else if(state.screen==='win')html=`<section class="hero"><div class="art">🏆 🎁 ✨</div><h1>Die Schatzkammer ist offen!</h1><p class="lead">Ihr habt alle fünf Türen geöffnet und zusammen geknobelt. Fantastisch!</p></section><section class="panel center"><div style="font-size:70px">💎👑💎</div><h2>Ihr seid echte Mathe-Asse!</h2><p>Der größte Schatz ist eure gemeinsame Knobel-Power.</p><div class="stars">⭐⭐⭐⭐⭐</div><p>Jetzt erzählt euch gegenseitig: Welches Rätsel war besonders clever?</p><div class="actions"><button class="primary" data-action="map">🔁 Weitere Stufen ausprobieren</button><button class="secondary" data-action="print">🖨️ Urkunde drucken</button></div></section>`;
app.innerHTML=html;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{state.room=+b.dataset.room;state.level=state.done[state.room]??0;state.attempt=null;state.hint=false;state.screen='room';render()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.level=+b.dataset.level;state.attempt=null;state.hint=false;render()});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.attempt=+b.dataset.choice;render()});}
function act(a){if(a==='start'||a==='map'){state.screen='map';render()}if(a==='hint'){state.hint=true;render()}if(a==='speak'){say(rooms[state.room].story)}if(a==='speakq'){say(rooms[state.room].q[state.level].prompt)}if(a==='complete'){state.done[state.room]=state.level;state.screen='map';render()}if(a==='finish'){state.screen='win';render()}if(a==='print'){const w=window.open('','_blank');if(!w){alert('Bitte Pop-ups erlauben.');return}w.document.write('<html lang="de"><meta charset="utf-8"><body style="font-family:Arial;text-align:center;padding:90px;border:12px double #654189"><h1>🏆 Urkunde für Mathe-Asse 🏆</h1><p style="font-size:24px">Wir haben die fünf Türen der Spukvilla geöffnet!</p><p style="font-size:50px">🎃 ⭐ 👻 ⭐ 🎃</p><p>Gemeinsam gedacht, ausprobiert und Rätsel gelöst.</p><p style="margin-top:70px">Namen: __________________________________</p></body></html>');w.document.close();w.print()}}
document.getElementById('reset').onclick=()=>{if(confirm('Wirklich von vorne beginnen? Alle Schlüssel gehen verloren.')){state={screen:'home',room:0,level:0,done:{},attempt:null,hint:false,names:['','']};render()}};render();
</script></body></html>
